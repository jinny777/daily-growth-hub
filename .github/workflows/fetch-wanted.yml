name: 원티드 채용공고 자동 수집 (Gmail)

on:
  schedule:
    - cron: '0 2 * * *'   # 매일 오전 11시 KST (UTC 02:00)
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  fetch-wanted:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 원티드 채용공고 수집 (Gmail)
        run: python gmail_job_fetch.py
        env:
          PYTHONIOENCODING: utf-8
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: wanted_jobs.json 커밋 & 푸시
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git pull --rebase origin main
          git add wanted_jobs.json
          git diff --staged --quiet || git commit -m "chore: 원티드 채용공고 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
