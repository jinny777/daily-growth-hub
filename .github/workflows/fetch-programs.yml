name: 지원사업 공고 자동 수집

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 KST (UTC 00:00)
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 공고 수집 스크립트 실행
        run: python startup_fetch.py
        env:
          PYTHONIOENCODING: utf-8

      - name: programs_import.json 커밋 & 푸시
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add programs_import.json
          git diff --staged --quiet || git commit -m "chore: 지원사업 공고 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
