<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행·맛집 카드</title><style>
*{box-sizing:border-box;min-width:0}body{margin:0;background:#f5f3ec;color:#191919;font-family:Arial,'Malgun Gothic',sans-serif}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{position:sticky;top:0;height:100vh;overflow:auto;background:#171717;color:#fff;padding:20px 14px}.brand{font-weight:800;font-size:17px;margin-bottom:28px}.brand small{display:block;color:#999;font-size:8px;letter-spacing:1.5px;margin-top:6px}nav{display:grid;gap:5px;margin-bottom:24px}nav a{color:#aaa;text-decoration:none;padding:11px 10px;font-size:12px;font-weight:700;border-radius:4px}nav a.active{background:#d8ff36;color:#171717}.filters{display:grid;gap:5px}.filters button,.mobileFilters button{border:0;background:transparent;color:#aaa;padding:10px;text-align:left;cursor:pointer}.filters button.on{background:#292929;color:#d8ff36}main{padding-bottom:70px}header{background:#fff;border-bottom:1px solid #dedbd3;padding:20px 34px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:20px;margin:0}header a{font-size:11px;color:#5e48df;text-decoration:none}.hero{max-width:1180px;margin:34px auto 20px;background:#171717;color:#fff;border-bottom:7px solid #d8ff36;padding:34px 40px;display:flex;justify-content:space-between;align-items:end}.hero h2{font-size:30px;font-weight:400}.hero b,.hero>strong{color:#d8ff36}.hero>strong{font-size:48px}.tools{max-width:1180px;margin:0 auto 16px;display:flex;justify-content:flex-end}.tools input{width:320px;max-width:100%;padding:11px;border:1px solid #d7d4cc}.mobileFilters{display:none}.grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid #e0ddd4;padding:20px}.head{display:flex;justify-content:space-between;border-bottom:2px solid #171717;padding-bottom:12px}.head h2{margin:4px 0 0}.head span{background:#d8ff36;padding:5px 8px;height:max-content}.place{display:block;color:#191919;text-decoration:none;border-bottom:1px solid #eeeae2;padding:12px 3px}.place b{font-size:13px}.place em{font-style:normal;font-size:9px;color:#7866ff;background:#f0edff;padding:3px 5px;margin-left:7px}.place small,.place span{display:block;color:#777;font-size:10px;margin-top:5px;overflow-wrap:anywhere}.empty{text-align:center;padding:50px}.source{display:block;text-align:right;color:#5e48df;text-decoration:none;font-size:10px;margin-top:13px}
@media(max-width:760px){.shell{display:block}aside{position:static;height:auto}.filters{display:none}nav{display:flex;overflow-x:auto;margin:0}nav a{white-space:nowrap}header{padding:15px}.hero{margin:16px 12px;padding:24px 20px}.hero h2{font-size:23px}.hero>strong{font-size:34px}.tools{margin:0 12px 12px;display:grid;gap:8px}.tools input{width:100%}.mobileFilters{display:flex;gap:6px}.mobileFilters button{background:#fff;border:1px solid #ccc}.mobileFilters button.on{background:#171717;color:#d8ff36}.grid{grid-template-columns:1fr;margin:0 12px}.card{padding:16px}}

:root{--bg:#fffaf4;--ink:#1e293b;--muted:#64748b;--primary:#ff6b4a;--primary2:#ff9a62;--card:#fff;--line:#eadfd5;--soft:#fff1e8;--shadow:0 20px 60px rgba(57,39,27,.12)}
body{background:linear-gradient(180deg,#fffaf4 0%,#fff 48%,#f8fbff 100%);color:var(--ink);line-height:1.65}
.shell{display:block;min-height:100vh}
aside{position:sticky;top:0;z-index:40;width:100%;height:auto;overflow:visible;background:rgba(255,250,244,.9);color:var(--ink);padding:12px max(20px,calc((100% - 1160px)/2));backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,223,213,.8);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{margin:0;display:flex;align-items:center;gap:10px;font-size:21px}.brand:before{content:"✦";width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#ffc46b);display:grid;place-items:center;color:white;box-shadow:0 8px 20px rgba(255,107,74,.3)}.brand small{color:var(--muted);margin:0;font-size:8px}
.filters{display:flex;gap:8px}.filters button{color:#7c4a34;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-weight:800;text-align:center}.filters button.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 9px 20px rgba(255,107,74,.24)}
main{padding-bottom:70px}header{width:min(1160px,calc(100% - 40px));margin:auto;background:transparent;border:0;padding:48px 0 0}header h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.04em}
.hero{width:min(1160px,calc(100% - 40px));max-width:none;margin:22px auto 26px;background:linear-gradient(135deg,#ff724f,#ff9e68 52%,#8a6bea);border:0;border-radius:34px;padding:44px 48px;box-shadow:0 26px 65px rgba(137,77,54,.22)}.hero small{font-weight:900;letter-spacing:.12em}.hero h2{font-size:clamp(28px,4vw,46px);line-height:1.18;letter-spacing:-.03em;margin:14px 0 10px}.hero b,.hero>strong{color:#fff}.hero p{color:#fff7f0;margin:0}.hero>strong{font-size:54px;text-shadow:0 3px 15px rgba(84,35,20,.18)}
.tools{width:min(1160px,calc(100% - 40px));max-width:none;margin:0 auto 20px}.tools input{width:380px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 17px;box-shadow:0 8px 24px rgba(45,35,28,.06);outline:none}.tools input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(255,107,74,.12)}
.grid{width:min(1160px,calc(100% - 40px));max-width:none;gap:20px}.card{border:1px solid #eee5dc;border-radius:24px;padding:26px;box-shadow:0 12px 35px rgba(45,35,28,.06);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.head{border-bottom:1px solid var(--line);padding-bottom:16px}.head small{color:var(--primary);font-weight:900}.head h2{font-size:23px}.head span{background:var(--soft);color:var(--primary);border-radius:999px;padding:6px 11px}
.place{border-bottom:1px solid #f1e9e1;padding:15px 4px;border-radius:12px;transition:.18s}.place:hover{background:var(--soft);padding-left:12px}.place b{font-size:14px}.place em{color:#8b5cf6;background:#f1edff;border-radius:999px;padding:4px 8px}.place span{color:var(--primary);font-weight:800}
@media(max-width:760px){aside{position:sticky;height:auto;padding:10px 13px;display:block}.brand{font-size:17px;margin-bottom:10px}.brand:before{width:34px;height:34px}.filters{display:none}header{width:min(100% - 26px,1160px);padding-top:28px}.hero{width:min(100% - 26px,1160px);padding:30px 24px;border-radius:25px}.hero>strong{font-size:38px}.tools,.grid{width:min(100% - 26px,1160px);margin-left:auto;margin-right:auto}.mobileFilters{display:flex;gap:7px}.mobileFilters button{border-radius:999px;padding:8px 14px;color:#7c4a34;border-color:var(--line)}.mobileFilters button.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}.card{padding:20px;border-radius:20px}}

.place{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}.place-preview{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#fff1e8,#ffe1cf);border:1px solid #f4d8c8;box-shadow:inset 0 0 24px rgba(255,255,255,.65)}.place-preview.cafe{background:linear-gradient(145deg,#efe4d4,#d9b995)}.place-preview.korean{background:linear-gradient(145deg,#fff0d1,#ffd19a)}.place-preview.sea{background:linear-gradient(145deg,#dff5f7,#aedfe8)}.place-preview.meat{background:linear-gradient(145deg,#ffe0dc,#ffb6aa)}.place-main{min-width:0}.place-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.place-desc{display:block;color:#475569;font-size:11px;line-height:1.55;margin-top:6px}.place small{font-size:10px}.place span{display:inline-block;margin-top:7px}.preview-note{width:min(1160px,calc(100% - 40px));margin:0 auto 16px;color:var(--muted);font-size:12px;text-align:right}
@media(max-width:760px){.place{grid-template-columns:62px minmax(0,1fr);gap:11px}.place-preview{width:62px;height:62px;border-radius:15px;font-size:26px}.preview-note{width:min(100% - 26px,1160px);text-align:left}}
</style></head><body><div class="shell"><aside><div class="brand">여행·맛집 카드<small>TRAVEL & FOOD ARCHIVE</small></div><div class="filters" id="filters"></div></aside><main><header><h1>여행·맛집 정리 카드</h1></header><section class="hero"><div><small>PLACE COLLECTION</small><h2>가보고 싶은 곳을<br><b>지역별로 찾아보세요.</b></h2><p>전자필기장에 기록한 식당과 카페를 한곳에 모았습니다.</p></div><strong id="total"></strong></section><section class="tools"><div class="mobileFilters" id="mobileFilters"></div><input id="search" placeholder="지역, 식당, 메뉴 검색"></section><div class="preview-note">장소 특징을 미리 보고, 실제 사진과 최신 리뷰는 ‘사진·리뷰 보기’에서 확인하세요.</div><section class="grid" id="grid"></section></main></div><script>
const regions=[{"region":"경기도 광주·남양주","area":"경기","source":"s0-0","places":[["흙토담골","경기 광주시 퇴촌면 석둔길 3","한식","https://naver.me/GWFr729r"],["초대한정식","남양주 한강뷰 한정식","한정식","https://naver.me/xRPhFRno"],["카페숨","","카페","https://naver.me/5eUQjzTe"],["라온숨","","카페","https://naver.me/FORMnNG1"],["브리끄","","카페","https://naver.me/xwomnU66"]]},{"region":"송파","area":"서울","source":"s1-2","places":[["MIP","서울 송파구 석촌호수로 272","맛집","https://naver.me/xOmHQTYW"],["소담촌 가락시장직영점","","샤브샤브","https://naver.me/FA2xvMFF"],["고봉삼계탕 가락점","서울 송파구 송이로 161","삼계탕","https://naver.me/Ix7BIn7M"],["논현삼계탕 송파점","서울 송파구 송이로 138","삼계탕","https://naver.me/Gd1ujjrQ"]]},{"region":"문정","area":"서울","source":"s1-3","places":[["진짜배기명태촌 문정점","","명태요리","https://naver.me/GROzAC7x"],["차이킹 문정점","서울 송파구 법원로 128","중식","https://naver.me/xejfXhPu"]]},{"region":"성남·판교","area":"경기","source":"s1-4","places":[["사랑이네 생선구이","","생선구이","https://naver.me/GUwSK8ke"],["만두전골과칼국수 미가온","경기 성남시 분당구 하오개로 358","만두전골·칼국수","https://naver.me/xWiXmLWh"],["장모밥상","경기 성남시 분당구 하오개로344번길 5","한식","https://naver.me/xGiP8hAu"],["삼동소바 판교점","경기 성남시 분당구 안양판교로828번길 20","소바","https://naver.me/xl1DFAWL"],["판교몽","경기 성남시 분당구 석운로 302","맛집","https://naver.me/FuEutxTQ"],["해누리 분당점","","한식","https://naver.me/FgHDJdH6"],["정선한우","경기 성남시 분당구 하오개로 357","한우","https://naver.me/5JQUHWF7"]]},{"region":"의왕","area":"경기","source":"s1-5","places":[["농군의집","경기 의왕시 오매기백운산길 54-13","한식","https://naver.me/xmrP7oao"],["전복명가","경기 의왕시 학현로 158","전복요리","https://naver.me/xiv52qOq"],["백운원","경기 의왕시 백운안길 61 1·2층","한식","https://naver.me/5T3At07Y"],["디마인커피로스터즈","","카페","https://naver.me/5k7vv2Sd"]]},{"region":"하남","area":"경기","source":"s1-8","places":[["흰구름 전통찻집","","전통찻집","https://naver.me/FCAtMLQr"],["보리향","","한식","https://naver.me/xIeS1Sfn"],["교산가마솥밥한상","경기 하남시 서하남로418번길 37-35","가마솥밥","https://naver.me/GnC42Ruh"],["본가 장수촌","","백숙","https://naver.me/5ncX7mHS"],["들반차반","","한식","https://naver.me/xafIRHe9"],["정성고등어 하남미사본점","","생선구이","https://naver.me/59voV3Yp"],["한채당 한정식","","한정식","https://naver.me/xIeX7ekq"],["하인선생 하남미사점","","중식","https://naver.me/GkRfjR5w"],["지구에서 온 쭈꾸미 하남본점","","쭈꾸미","https://naver.me/IGJYsCYF"],["소나무집","","닭백숙","https://naver.me/FN7smaAu"],["쇼미더크랩 하남","","해산물","https://naver.me/Gsj2Jpoe"],["밥상천하","","한식","https://naver.me/FDnCGgTh"],["박승광 해물손칼국수","","해물칼국수","https://naver.me/5PVaewOV"]]},{"region":"도곡","area":"서울","source":"s4-1","places":[["천향 도곡점","","중식","https://naver.me/5dupAQH9"],["로마옥 도곡","","이탈리안","https://naver.me/xtWHGo1V"],["사리원 도곡점","서울 강남구 남부순환로 2712","한식","https://naver.me/5BvjsvQW"]]},{"region":"양재","area":"서울","source":"s4-2","places":[["한상차림 코다리 명가","","코다리","https://naver.me/FQaISKps"],["통나무집","","한식","https://naver.me/5XJINYqc"],["영주축협한우프라자","","한우","https://naver.me/5JJQeYT8"],["이남장","","설렁탕","https://naver.me/IMQpQO5b"],["직송한우공장","서울 서초구 남부순환로 2652 대명빌딩 1층","한우","https://naver.me/FbOokGwN"]]},{"region":"방배","area":"서울","source":"s4-4","places":[["일도씨닭갈비 방배점","서울 서초구 방배로8길 4","닭갈비","https://naver.me/GXRpjY5c"]]}]; let area="전체",q=""; const areas=["전체","서울","경기"];
function renderFilters(){for(const id of ["filters","mobileFilters"]){document.getElementById(id).innerHTML=areas.map(x=>'<button class="'+(area===x?'on':'')+'" data-area="'+x+'">'+x+'</button>').join('');document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{area=b.dataset.area;render()})}}
function placeVisual(type){const t=type||"";if(/카페|찻집/.test(t))return["☕","cafe"];if(/해물|생선|전복|쭈꾸미/.test(t))return["🐟","sea"];if(/한우|닭|갈비|백숙/.test(t))return["🍖","meat"];if(/중식/.test(t))return["🥢","korean"];if(/소바|칼국수|설렁탕/.test(t))return["🍜","korean"];return["🍽️","korean"]}
function placeSummary(p,r){const location=p[1]||r.region+" 지역";return location+"에서 찾아볼 수 있는 "+p[2]+" 장소입니다."}
function render(){renderFilters();const v=regions.map(r=>({...r,places:r.places.filter(p=>(area==="전체"||r.area===area)&&(!q||((r.region+" "+p.join(" ")).toLowerCase().includes(q))))})).filter(r=>r.places.length);document.getElementById("total").textContent=v.reduce((n,r)=>n+r.places.length,0)+"개";document.getElementById("grid").innerHTML=v.length?v.map(r=>'<article class="card"><div class="head"><div><small>'+r.area+'</small><h2>'+r.region+'</h2></div><span>'+r.places.length+'</span></div>'+r.places.map(p=>{const visual=placeVisual(p[2]);return '<a class="place" href="'+p[3]+'" target="_blank" rel="noreferrer"><div class="place-preview '+visual[1]+'" aria-hidden="true">'+visual[0]+'</div><div class="place-main"><div class="place-title"><b>'+p[0]+'</b><em>'+p[2]+'</em></div>'+(p[1]?'<small>📍 '+p[1]+'</small>':'<small>📍 '+r.region+'</small>')+'<i class="place-desc">'+placeSummary(p,r)+'</i><span>실제 사진·리뷰 보기 ↗</span></div></a>'}).join('')+'</article>').join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
document.getElementById("search").oninput=e=>{q=e.target.value.toLowerCase();render()};render();
</script></body></html>
